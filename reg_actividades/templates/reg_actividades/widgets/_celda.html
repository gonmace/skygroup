{% if c.tipo == 'select' %}<select name="{{ c.campo }}" aria-label="{{ c.label }}" {% if not puede_escribir %}disabled{% endif %} class="select select-bordered select-sm w-full min-w-28"><option value="">—</option>{% for o in c.opciones %}<option value="{{ o }}" {% if c.valor == o %}selected{% endif %}>{{ o }}</option>{% endfor %}</select>
{% elif c.tipo == 'number' %}<input type="number" step="any" name="{{ c.campo }}" value="{{ c.valor }}" aria-label="{{ c.label }}" placeholder="{{ c.placeholder }}" {% if not puede_escribir %}disabled{% endif %} class="input input-bordered input-sm w-full min-w-20">
{% elif c.tipo == 'date' %}<input type="date" name="{{ c.campo }}" value="{{ c.valor }}" aria-label="{{ c.label }}" {% if not puede_escribir %}disabled{% endif %} class="input input-bordered input-sm w-full">
{% elif c.tipo == 'time' %}<input type="time" name="{{ c.campo }}" value="{{ c.valor }}" aria-label="{{ c.label }}" {% if not puede_escribir %}disabled{% endif %} class="input input-bordered input-sm w-full">
{% else %}<input type="text" name="{{ c.campo }}" value="{{ c.valor }}" aria-label="{{ c.label }}" placeholder="{{ c.placeholder }}" {% if not puede_escribir %}disabled{% endif %} class="input input-bordered input-sm w-full min-w-32">{% endif %}
