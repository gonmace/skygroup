{% extends "shell.html" %}
{% block page_title %}Perfil de jornadas · {{ persona.user }}{% endblock %}
{% block content_main %}
<form method="post" class="card max-w-2xl bg-base-100"><div class="card-body gap-4">
  {% csrf_token %}
  {% include "components/campos.html" %}
  <div class="card-actions justify-end">
    <a href="{% url 'jor_diario:persona' persona.pk %}" class="btn btn-ghost">Cancelar</a>
    <button type="submit" class="btn btn-primary">Guardar</button>
  </div>
</div></form>
{% endblock %}
