<section class="table-card">
  <div class="border-b border-base-300 px-5 py-3"><h2 class="text-base font-semibold">{{ titulo }}</h2></div>
  <table class="table table-sm">
    <thead><tr><th></th><th class="text-right">Llamadas</th><th class="text-right">Tokens</th><th class="text-right">USD</th></tr></thead>
    <tbody>
    {% for f in filas %}<tr><td class="max-w-40 truncate">{{ f.nombre }}</td><td class="text-right tabular-nums">{{ f.llamadas }}</td><td class="text-right tabular-nums">{{ f.entrada }} / {{ f.salida }}</td><td class="text-right tabular-nums">{{ f.costo|floatformat:4 }}</td></tr>
    {% empty %}<tr><td colspan="4" class="py-4 text-center text-base-content/60">Sin datos.</td></tr>{% endfor %}
    </tbody>
  </table>
</section>
