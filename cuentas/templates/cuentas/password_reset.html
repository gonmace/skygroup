{% extends "cuentas/_auth_base.html" %}
{% block title %}Recuperar contraseña{% endblock %}
{% block auth_titulo %}Recuperar contraseña{% endblock %}
{% block auth_cuerpo %}
<form method="post" class="flex flex-col gap-4">
  {% csrf_token %}
  <p class="text-sm text-base-content/70">Te enviaremos un enlace para elegir una contraseña nueva.</p>
  <input type="email" name="email" required autocomplete="email" placeholder="Correo" class="input input-bordered w-full">
  <button type="submit" class="btn btn-primary">Enviar enlace</button>
  <a href="{% url 'cuentas:login' %}" class="link link-hover text-sm text-center">Volver</a>
</form>
{% endblock %}
