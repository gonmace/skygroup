{% load tareas_extras %}
<div class="avatar-user {{ size|default:'w-7 h-7' }} flex shrink-0 items-center justify-center rounded-full{% if muted %} grayscale{% endif %}"
     data-avatar-color="{{ u|avatar_color }}" title="{{ u.get_full_name|default:u.email }}">
  <span class="text-[11px] font-bold uppercase">{% if u.first_name or u.last_name %}{{ u.first_name|slice:':1' }}{{ u.last_name|slice:':1' }}{% else %}{{ u.email|slice:':2' }}{% endif %}</span>
</div>
