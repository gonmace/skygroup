{% extends "shell.html" %}
{% block page_title %}{% if obj %}Editar {{ obj.nombre }}{% else %}Nueva empresa{% endif %}{% endblock %}
{% block content_main %}
<form method="post" enctype="multipart/form-data" class="card bg-base-100">
  <div class="card-body gap-4">
    {% csrf_token %}
    {% include "components/campos.html" %}
    <div class="card-actions justify-end">
      <a href="{% url 'panel:empresas' %}" class="btn btn-ghost">Cancelar</a>
      <button type="submit" class="btn btn-primary">Guardar</button>
    </div>
  </div>
</form>
{% endblock %}
